name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Python syntax check
        run: |
          python3 -m py_compile main.py
          python3 -m py_compile cli.py

      - name: Verify plugin.json
        run: |
          python3 -c "import json; json.load(open('plugin.json')); print('plugin.json valid')"

      - name: Verify install.sh
        run: |
          bash -n install.sh && echo 'install.sh syntax OK'